# Editorial policy for generated newsletters.
#
# This is the file you tune. It holds *policy* — what a good item looks like,
# how long a blurb runs, which sections exist — and never per-newsletter state.
# Which groups a newsletter draws from, how often it runs and who receives it
# are rows in the database, edited in the Letters screen.
#
# Registered in config_source.DOCUMENTS, so it is versioned in the database with
# history and rollback, and editable in the Config screen without a deploy.

# The taxonomy the editor is allowed to use. `IssuePublisher` validates every
# section id the model returns against this list, so a section invented at
# generation time is dropped rather than rendered.
sections:
  - id: microsoft
    title: "From Microsoft"
    guidance: >-
      Product announcements, release plans, deprecations and anything that
      changes what a Power Platform or Microsoft 365 practitioner can build.
  - id: ai
    title: "AI worth knowing about"
    guidance: >-
      Model releases, capability shifts, tooling that changes how people build
      with LLMs. Prefer things with a concrete artefact — a model, a repo, a
      benchmark — over commentary about the field.
  - id: research
    title: "Papers"
    guidance: >-
      Preprints and papers with a result someone could act on or repeat. Skip
      surveys and position pieces unless they genuinely reframe something.
  - id: tooling
    title: "Tooling"
    guidance: >-
      Libraries, SDKs, developer tools and platform changes.
  - id: worth_a_look
    title: "Also worth a look"
    guidance: >-
      Anything good that does not fit the sections above. Keep it short.

editorial:
  # Hard caps. IssuePublisher truncates rather than trusting the model to count.
  headline_max_chars: 90
  blurb_max_words: 40
  intro_max_words: 80

  include_rules:
    - "Prefer a concrete change over an opinion about a change."
    - "Prefer primary sources: a vendor's own announcement over coverage of it."
    - "If two items are the same story, keep the one with more substance and drop the other."
    - "Say why it matters to someone building things, not why it is interesting in general."

  exclude_rules:
    - "Funding rounds, valuations and acquisitions with no product consequence."
    - "Listicles, 'top N tools', and roundups of other roundups."
    - "Reposted press releases with no added reporting."
    - "Anything whose headline is a question the article does not answer."

  banned_phrases:
    - "game changer"
    - "revolutionary"
    - "in today's fast-paced world"
    - "dive into"
    - "unlock the power of"
    - "seamlessly"

  # Written into the prompt as the standing brief. The per-newsletter `audience`
  # and `tone` fields are appended to this.
  voice: >-
    Plain, specific and unhurried. Assume a working practitioner who is short of
    time and allergic to marketing language. One or two sentences per item. If
    an item is genuinely dull, say so briefly rather than inflating it.

render:
  brand_colour: "#c084fc"
  # Kept deliberately small: an email footer that runs longer than the content
  # is a footer nobody reads.
  footer: >-
    Generated by the Power Platform Ninja news crew. Sources are linked on every
    item — read the original before you rely on it.
