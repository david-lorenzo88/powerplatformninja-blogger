<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but zero, so the bottom tab bar can clear the home indicator.
         Deliberately no maximum-scale/user-scalable: pinch-zoom stays available,
         and zoom-on-focus is handled by the 16px inputs in lib/ui.ts instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- crossorigin="use-credentials" is load-bearing, not boilerplate. A
         manifest link with no crossorigin attribute is fetched with credentials
         omitted even same-origin, so behind Entra Easy Auth it is answered with
         a 302 to Microsoft, the parse fails on HTML, and the app is simply not
         installable — with no error surfaced anywhere. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Watch and steer the blogging crew: runs, topic ideas, source reviews and drafts." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PPN Blogger" />
    <title>PPN Blogger — crew console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
