[project]
name = "ppn-blogger"
version = "0.1.0"
description = "Multi-agent blog drafting crew for powerplatformninja.com, orchestrated with Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.12,<2",
    "agent-framework-foundry>=1.10,<2",
    "agent-framework-orchestrations>=1.0,<2",
    "azure-identity>=1.19",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "markdown>=3.7",
    "openai>=1.60",
    "pillow>=10.4",
    "beautifulsoup4>=4.12",
    "python-slugify>=8.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "ppn-blogger[server]",
]

[project.scripts]
ppn = "ppn_blogger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppn_blogger"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in defaults is the documented Typer style.
"src/ppn_blogger/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
